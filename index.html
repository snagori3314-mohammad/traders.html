const billDue=(t,ex)=>{const lk=y=>S.pays.filter(x=>x.tid===y.id&&x.id!==ex).reduce((a,x)=>a+x.amt,0),own=y=>ttot(y)-y.paid-lk(y);

document.addEventListener('click',e=>{const d=e.target.dataset||{};const cd=e.target.closest&&e.target.closest('[data-card]');if(cd)cardDetail(cd.dataset.card);if(d.inv)invoice(d.inv);if(d.edit){const t=S.txns.find(x=>x.id===d.edit),r=ret;closeM();go(t.type);ret=r;txForm(t.type,d.edit)}if(d.th2)setTheme(d.th2);if(d.wb){const t=S.txns.find(x=>x.id===d.wb);billModal(t.pid,t.id)}if(d.rm){rm=d.rm;rk=null;drawRep()}if(d.rk){rk=d.rk;drawRep()}if(d.gm){rm='m';rk=d.gm;drawRep()}if(d.epay)payModal(d.epay);if(d.open)partyV(d.open);if(d.wa)shareWA(d.wa);if(d.ep){const x=S.pays.find(y=>y.id===d.ep);party(x.pid).type==='customer'?payModal(x.id):vpModal(x.id)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.card){e.preventDefault();cardDetail(e.target.dataset.card)}});

function invoice(id){const t=S.txns.find(x=>x.id===id),p=party(t.pid),isS=t.type==='sale';
modal(`<div class="inv"><div class="hd"><div><h1>SAMEER BAXAWALE & CO</h1><div>Animal feed – purchase & sale</div></div><div style="text-align:right"><b>${isS?'Sales invoice':'Purchase record'}</b><br>${t.no}<br>${t.date}</div></div>
<p><b>${isS?'Billed to':'Supplier'}:</b> ${esc(p.name)}${p.addr?', '+esc(p.addr):''}${p.phone?' · '+esc(p.phone):''}</p>
<div class="scroll"><table><tr><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr>
${t.items.map(l=>`<tr><td>${l.goods?esc(l.goods):l.pid?esc(prod(l.pid).name):'Feed sold'}${l.slip?`<br><img src="${l.slip}" alt="Weight slip" style="max-width:110px;margin-top:4px;border-radius:4px">`:''}</td><td class="n">${l.qty} ${l.pid?prod(l.pid).unit:'kg'}</td><td class="n">${l.rate!=null?fmt(l.rate):'-'}</td><td class="n">${fmt(l.amt!=null?l.amt:l.qty*l.rate)}</td></tr>`).join('')}
<tr><td colspan="3" class="n">Subtotal</td><td class="n">${fmt(tsub(t))}</td></tr>${t.disc?`<tr><td colspan="3" class="n">Discount</td><td class="n">-${fmt(t.disc)}</td></tr>`:''}
<tr><td colspan="3" class="n"><b>Total</b></td><td class="n"><b>${fmt(ttot(t))}</b></td></tr><tr><td colspan="3" class="n">Paid</td><td class="n">${fmt(ttot(t)-billDue(t))}</td></tr>
<tr><td colspan="3" class="n"><b>Balance due</b></td><td class="n"><b>${fmt(billDue(t))}</b></td></tr></table></div></div>
<p class="noprint" style="margin-top:16px"><button class="btn" id="pr">Print</button> <button class="btn alt" data-edit="${t.id}">Edit</button> ${isS?`<button class="btn alt" data-wb="${t.id}">WhatsApp</button> `:''}<button class="btn alt" id="cl">Close</button></p>`);
$('#cl').onclick=()=>{closeM();go(tab)};$('#pr').onclick=()=>window.print()}
function modal(h){$('#mbox').innerHTML=h;$('#modal').style.display='flex'}
function closeM(){$('#modal').style.display='none'}
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const hashP=(s,salt)=>{let a=0xdeadbeef,b=0x41c6ce57;const t=salt+':'+s+':'+salt;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
let pin='',stage='enter',first='',fails=0,until=0,hid=0;
const dots=()=>$$('#dots i').forEach((d,i)=>d.classList.toggle('f',i<pin.length));
const lmsg=(m,bad)=>{$('#lkmsg').textContent=m;if(bad){const d=$('#dots');d.classList.remove('bad');void d.offsetWidth;d.classList.add('bad')}};
function unlock(){$('#lock').style.display='none';pin='';fails=0}
function lockInit(now,change){const has=!!LS.get('sbco_pin');stage=change||!has?'create':'enter';pin='';first='';dots();
lmsg(stage==='create'?(change?'Choose a new 6-digit PIN':'Create a 6-digit PIN'):'Enter your 6-digit PIN');
$('#forgot').style.display=stage==='enter'?'':'none';$('#lkcancel').style.display=change?'':'none';$('#lkx').hidden=true;$('#lkp').hidden=false;
$('#lock').style.display='flex';$('#lkpad').classList.toggle('hide',!now);if(!now)setTimeout(()=>$('#lkpad').classList.remove('hide'),1200)}
function press(k){if(Date.now()<until)return;if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<6)pin+=k;dots();if(pin.length===6)setTimeout(submitPin,150)}
function submitPin(){const sl=LS.get('sbco_salt')||'';
if(stage==='enter'){if(hashP(pin,sl)===LS.get('sbco_pin'))return unlock();fails++;pin='';dots();if(fails>=5){until=Date.now()+30000;fails=0;lmsg('Too many wrong tries. Wait 30 seconds.',1)}else lmsg('Wrong PIN. '+(5-fails)+' tries left.',1);return}
if(stage==='create'){first=pin;pin='';stage='confirm';dots();lmsg('Enter the PIN again to confirm');return}
if(pin===first){const s=Math.random().toString(36).slice(2);LS.set('sbco_salt',s);LS.set('sbco_pin',hashP(pin,s));unlock();toast('PIN saved')}else{pin='';first='';stage='create';dots();lmsg('PINs did not match. Create it again.',1)}}
$('#keys').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}" aria-label="${k==='⌫'?'Delete':k}">${k}</button>`).join('');
$('#keys').onclick=e=>{const b=e.target.closest('button');if(b)press(b.dataset.k)};
document.addEventListener('keydown',e=>{if($('#lock').style.display!=='flex')return;if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫')});
$('#forgot').onclick=()=>{$('#lkp').hidden=true;$('#lkx').hidden=false};
$('#lkback').onclick=()=>{$('#lkx').hidden=true;$('#lkp').hidden=false};
$('#lkerase').onclick=async()=>{await IDB.clear();['sbco','sbco_pin','sbco_salt','sbco_lb'].forEach(LS.del);location.reload()};
$('#lkcancel').onclick=unlock;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(LS.get('sbco_pin')&&hid&&Date.now()-hid>120000&&$('#lock').style.display!=='flex')lockInit(true)});
async function boot(){const ok=await Promise.race([IDB.open(),new Promise(r=>setTimeout(()=>r(false),2500))]);
if(ok){const d=await IDB.get('data');if(d&&d.products)S=d;else await IDB.set('data',S);if(hadLS)LS.del('sbco');try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
if(bc)bc.onmessage=()=>IDB.get('data').then(d=>{if(d&&d.products){S=d;if(tab==='dash'&&$('#lock').style.display!=='flex')dash()}});
cleanS();setTheme();go('dash')}
setTheme();lockInit();boot();
</script>
